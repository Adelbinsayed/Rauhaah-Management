name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Override src-tauri/.cargo/config.toml's local E:\ target-dir on CI runners
  CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build Tauri portable Windows binary (no installer bundle)
        run: npm run tauri build -- --no-bundle

      - name: Stage Rauhaah.exe artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows | Out-Null
          Copy-Item "$env:CARGO_TARGET_DIR/release/rauhaah-management.exe" "dist-windows/Rauhaah.exe"

      - name: Upload Rauhaah.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: rauhaah-windows-exe
          path: dist-windows/Rauhaah.exe
          if-no-files-found: error
