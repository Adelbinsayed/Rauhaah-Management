<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Rauhaah</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;
  background:#161513;
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  overflow:hidden;
  user-select:none;
}
.splash{
  width:100%;height:100%;
  background:#161513;
  border:1px solid rgba(239,233,222,0.08);
  display:flex;flex-direction:column;
  position:relative;
}
.gold-bar{
  height:2px;
  background:#d4a21c;
  flex-shrink:0;
}
.main{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:28px 48px 16px;
  position:relative;
}
.logo-wrap{
  margin-bottom:20px;
  display:flex;align-items:center;justify-content:center;
  animation:logoFade 500ms cubic-bezier(0.22,1,0.36,1);
}
@keyframes logoFade{
  0%{opacity:0;transform:translateY(6px);}
  100%{opacity:1;transform:translateY(0);}
}
.logo-img{
  max-width:260px;max-height:110px;object-fit:contain;
}
.div{width:36px;height:1px;background:rgba(239,233,222,0.12);margin-bottom:20px;}
.badges{display:flex;gap:8px;}
.badge{
  padding:4px 12px;border:1px solid rgba(239,233,222,0.09);border-radius:6px;
  font-size:11px;color:#8a847a;
  background:#1c1a18;
  transition:border-color 180ms cubic-bezier(0.22,1,0.36,1), color 180ms cubic-bezier(0.22,1,0.36,1), background-color 180ms cubic-bezier(0.22,1,0.36,1);
}
.badge.active{
  border-color:rgba(212,162,28,0.35);
  color:#d9aa2b;
  background:rgba(212,162,28,0.1);
}
.bar-wrap{padding:12px 24px 16px;flex-shrink:0;background:#12110f;border-top:1px solid rgba(239,233,222,0.08);}
.bar-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.status{
  font-size:11px;color:#b2aba0;
  min-height:16px;transition:opacity 180ms cubic-bezier(0.22,1,0.36,1), transform 180ms cubic-bezier(0.22,1,0.36,1);
  font-family:'JetBrains Mono',ui-monospace,monospace;
}
.status.fade-in{
  opacity:1;
  transform:translateY(0);
}
.status.fade-out{
  opacity:0;
  transform:translateY(-2px);
}
.ver{font-size:11px;color:#8a847a;font-family:'JetBrains Mono',ui-monospace,monospace;}
.track{height:3px;background:#262421;border-radius:3px;overflow:hidden;}
.fill{
  height:100%;
  background:#d4a21c;
  border-radius:3px;width:8%;
  transition:width 600ms cubic-bezier(0.22,1,0.36,1);
}
.copy{font-size:10px;color:#8a847a;text-align:center;margin-top:8px;}
</style>
</head>
<body>
<div class="splash">
  <div class="gold-bar"></div>
  <div class="main">
    <div class="logo-wrap">
      <img src="/assets/rauhaah-logo-white.png" alt="Rauhaah — Live Peaceful" class="logo-img" />
    </div>
    <div class="div"></div>
    <div class="badges">
      <div class="badge" id="b-inv">Inventory</div>
      <div class="badge" id="b-pos">POS</div>
      <div class="badge" id="b-rep">Reports</div>
      <div class="badge" id="b-blends">Blends</div>
    </div>
  </div>
  <div class="bar-wrap">
    <div class="bar-top">
      <div class="status fade-in" id="msg">Starting Rauhaah Management…</div>
      <div class="ver">v1.0.0</div>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="copy">© 2026 Sooktec &nbsp;·&nbsp; Rauhaah Management &nbsp;·&nbsp; Offline Desktop POS</div>
  </div>
</div>

<script type="module">
  import { invoke } from '@tauri-apps/api/core';

  const fill = document.getElementById('fill');
  const msg = document.getElementById('msg');
  const bInv = document.getElementById('b-inv');
  const bPos = document.getElementById('b-pos');
  const bRep = document.getElementById('b-rep');
  const bBlends = document.getElementById('b-blends');

  const steps = [
    { pct: 15, delay: 0,    text: 'Starting Rauhaah Management…', badge: null },
    { pct: 28, delay: 1000, text: 'Connecting offline SQLite database & WAL engine…', badge: bInv },
    { pct: 46, delay: 2100, text: 'Verifying security credentials & user session…', badge: bInv },
    { pct: 65, delay: 3200, text: 'Loading luxury attars, decants & catalog pricing…', badge: bPos },
    { pct: 82, delay: 4300, text: 'Preparing POS counter register & financial ledgers…', badge: bRep },
    { pct: 95, delay: 5300, text: 'Finalizing workspace & security checks…', badge: bBlends },
    { pct: 100, delay: 5900, text: 'Welcome back to Rauhaah. Live Peaceful.', badge: null },
  ];

  steps.forEach((s) => {
    setTimeout(() => {
      fill.style.width = s.pct + '%';

      msg.classList.remove('fade-in');
      msg.classList.add('fade-out');
      setTimeout(() => {
        msg.textContent = s.text;
        msg.classList.remove('fade-out');
        msg.classList.add('fade-in');
      }, 120);

      if (s.badge) {
        s.badge.classList.add('active');
      }
    }, s.delay);
  });

  const triggerClose = async () => {
    try {
      if (typeof window !== 'undefined' && window.__TAURI_INTERNALS__?.invoke) {
        await window.__TAURI_INTERNALS__.invoke('close_splashscreen');
      } else {
        await invoke('close_splashscreen');
      }
    } catch {
      try {
        await invoke('close_splashscreen');
      } catch {}
    }
  };

  setTimeout(triggerClose, 6400);
</script>
</body>
</html>
