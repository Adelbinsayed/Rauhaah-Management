<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Rauhaah</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;
  background:#202020;
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  overflow:hidden;
  user-select:none;
}
.splash{
  width:100%;height:100%;
  background:#202020;
  border:1px solid #2e2e2e;
  display:flex;flex-direction:column;
  position:relative;
}
.gold-bar{
  height:3px;
  background:linear-gradient(90deg,#c89a0a,#EFB810 40%,#f5d060 60%,#EFB810 80%,#c89a0a);
  flex-shrink:0;
}
.main{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:28px 48px 12px;
  position:relative;overflow:hidden;
}
.main::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 60% 50% at 50% 45%,rgba(239,184,16,.07) 0%,transparent 100%);
  pointer-events:none;
}
.lotus-wrap{margin-bottom:16px;}
svg.lotus{width:60px;height:52px;overflow:visible;}
.brand{
  font-size:52px;font-weight:700;font-style:italic;
  color:#EFB810;letter-spacing:-1px;line-height:1;
  text-shadow:0 0 40px rgba(239,184,16,.3);
}
.tagline{
  font-size:10px;letter-spacing:.28em;color:#777;
  text-transform:uppercase;margin-top:7px;margin-bottom:22px;
}
.div{width:36px;height:1px;background:#333;margin-bottom:22px;}
.badges{display:flex;gap:8px;}
.badge{
  padding:3px 11px;border:1px solid #333;border-radius:20px;
  font-size:9.5px;color:#666;letter-spacing:.05em;
}
.bar-wrap{padding:9px 18px 13px;flex-shrink:0;}
.bar-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.status{font-size:10px;color:#666;letter-spacing:.03em;min-height:14px;transition:opacity .2s;}
.ver{font-size:10px;color:#4a4a4a;}
.track{height:2px;background:#2a2a2a;border-radius:2px;overflow:hidden;}
.fill{
  height:100%;
  background:linear-gradient(90deg,#c89a0a,#EFB810,#f5d060);
  border-radius:2px;width:0%;
  transition:width .4s ease;
}
.copy{font-size:9px;color:#444;text-align:center;margin-top:6px;}
</style>
</head>
<body>
<div class="splash">
  <div class="gold-bar"></div>
  <div class="main">
    <div class="lotus-wrap">
      <svg class="lotus" viewBox="0 0 60 52" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="14" cy="30" rx="8" ry="16" fill="#c89a0a" opacity=".7" transform="rotate(-38 14 30)"/>
        <ellipse cx="46" cy="30" rx="8" ry="16" fill="#c89a0a" opacity=".7" transform="rotate(38 46 30)"/>
        <ellipse cx="22" cy="26" rx="8" ry="20" fill="#EFB810" opacity=".9" transform="rotate(-18 22 26)"/>
        <ellipse cx="38" cy="26" rx="8" ry="20" fill="#EFB810" opacity=".9" transform="rotate(18 38 26)"/>
        <ellipse cx="30" cy="22" rx="9" ry="22" fill="#f5d060"/>
        <circle cx="10" cy="12" r="1.5" fill="#EFB810" opacity=".5"/>
        <circle cx="50" cy="10" r="1" fill="#EFB810" opacity=".4"/>
        <circle cx="30" cy="2" r="2" fill="#EFB810" opacity=".6"/>
        <circle cx="20" cy="6" r="1.2" fill="#f5d060" opacity=".5"/>
        <circle cx="42" cy="5" r="1.5" fill="#f5d060" opacity=".45"/>
        <path d="M22 46 Q30 50 38 46" stroke="#c89a0a" stroke-width="1.5" stroke-linecap="round" fill="none" opacity=".4"/>
      </svg>
    </div>
    <div class="brand">Rauhaah</div>
    <div class="tagline">Live Peaceful</div>
    <div class="div"></div>
    <div class="badges">
      <div class="badge">Inventory</div>
      <div class="badge">POS</div>
      <div class="badge">Reports</div>
      <div class="badge">Blends</div>
    </div>
  </div>
  <div class="bar-wrap">
    <div class="bar-top">
      <div class="status" id="msg">Starting Rauhaah Management…</div>
      <div class="ver">v 1.0.0</div>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="copy">© 2026 Sooktec &nbsp;·&nbsp; Rauhaah Management &nbsp;·&nbsp; All rights reserved</div>
  </div>
</div>

<script type="module">
  import { invoke } from '@tauri-apps/api/core';

  const fill = document.getElementById('fill');
  const msg = document.getElementById('msg');

  const steps = [
    { pct: 15, delay: 0,    text: 'Starting Rauhaah Management…' },
    { pct: 40, delay: 300,  text: 'Initialising database…' },
    { pct: 65, delay: 650,  text: 'Checking portable workspace…' },
    { pct: 85, delay: 1000, text: 'Setting up workspace…' },
    { pct: 100, delay: 1350, text: 'Welcome back.' },
  ];

  steps.forEach((s) => {
    setTimeout(() => {
      fill.style.width = s.pct + '%';
      msg.textContent = s.text;
    }, s.delay);
  });

  setTimeout(() => {
    invoke('close_splashscreen').catch(() => {});
  }, 1650);
</script>
</body>
</html>
