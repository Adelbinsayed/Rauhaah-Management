[package]
name = "rauhaah-management"
version = "1.0.0"
description = "Inventory, pricing and POS for a perfume, attar and lifestyle shop"
authors = ["Sooktec"]
edition = "2021"

[lib]
name = "rauhaah_management_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", features = ["clock"] }
argon2 = "0.5"
rand = "0.8"
